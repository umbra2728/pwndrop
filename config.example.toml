# Pwndrop runtime configuration. Copy to config.toml via `make init`.
# Initial credentials and the private admin path deliberately belong in .env,
# which is generated locally and ignored by Git.

[pwndrop]
# Bind to all container interfaces; Compose exposes only host port 8080.
listen_ip = "0.0.0.0"
http_port = 8080

# Set to a positive port only when Pwndrop should own TLS itself.
# The supplied Compose setup intentionally runs HTTP-only.
https_port = 0

# Persistent named Docker volume.
data_dir = "/data"

# Admin UI bundled in the container image.
admin_dir = "/app/admin"
